# One-command start:  docker compose up --build
#   Web app      http://localhost:3000
#   Swagger UI   http://localhost:8080/swagger-ui.html
#   Health       http://localhost:8080/actuator/health
#
# Secrets: JWT_SECRET is read from the environment or a local .env file (see .env.example).
# The fallback below is a DEV-ONLY placeholder so the demo starts with one command — never use it in production.

name: helpdesk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: ${DB_USERNAME:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,demo}
      DB_URL: jdbc:postgresql://db:5432/helpdesk
      DB_USERNAME: ${DB_USERNAME:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789abcdef}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10

  web:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
